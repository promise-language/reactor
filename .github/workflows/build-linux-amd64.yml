name: Build (linux-amd64)

# Builds the release binary for linux x86-64 from main. Pull requests are not
# built here — this is the artifact-producing job, not the commit gate.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: reactor · linux-amd64 · release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Promise
        # Installs the epoch this project declares, read straight from
        # promise.toml so the toolchain and the manifest cannot drift apart.
        #
        # Pinned to the epoch tag rather than /releases/latest/: "latest" is
        # whichever release was published most recently, which includes
        # dependency-blob releases that carry no install.sh.
        #
        # pipefail matters here — without it `curl | sh` reports sh's status, so
        # a failed download would sail through and surface later as
        # "promise: command not found".
        run: |
          set -euo pipefail
          epoch="$(sed -n 's/^epoch[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' cmd/reactor/promise.toml)"
          if [ -z "$epoch" ]; then
            echo "no epoch declared in cmd/reactor/promise.toml" >&2
            exit 1
          fi
          echo "Installing Promise epoch $epoch"
          curl -sSfL "https://github.com/promise-language/promise/releases/download/epoch-${epoch}/install.sh" | sh
          echo "$HOME/.promise/bin" >> "$GITHUB_PATH"

      - name: Report toolchain
        run: promise version

      - name: Build release binary
        # bin/ is gitignored, so a fresh checkout does not have it and the
        # linker will not create the output directory itself.
        run: |
          set -euo pipefail
          mkdir -p bin
          promise build -release -o bin/reactor cmd/reactor

      - name: Smoke-test the binary
        # A release build that cannot start is not a release build. Cheap now,
        # and the hook for a real health check once there is something to check.
        run: ./bin/reactor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reactor-linux-amd64
          path: bin/reactor
          if-no-files-found: error
          retention-days: 30
